# Привязки уровня namespace: ClusterRole через RoleBinding действует
# только в своём домене.

# --- Домен sales ---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developers-view
  namespace: sales
  labels:
    propdev.ru/binding: readonly
subjects:
  - kind: Group
    name: propdev:developers:sales
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: namespace-viewer
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: operators-configure
  namespace: sales
  labels:
    propdev.ru/binding: configure
subjects:
  - kind: Group
    name: propdev:operators:sales
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: namespace-operator
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deploy
  namespace: sales
  labels:
    propdev.ru/binding: deploy
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: sales
roleRef:
  kind: ClusterRole
  name: ci-deployer
  apiGroup: rbac.authorization.k8s.io

