# Доступ к секретам: специалист по ИБ - во всех namespace,
# ведущий DevOps домена - в своём и только на время задачи (Just-In-Time).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: security-secret-access
  namespace: sales
  labels:
    propdev.ru/binding: privileged
subjects:
  - kind: Group
    name: propdev:security
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: secret-reader
  apiGroup: rbac.authorization.k8s.io

