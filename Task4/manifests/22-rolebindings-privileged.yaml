---
# Временный доступ ведущего DevOps домена ЖКУ к секретам своего namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gku-lead-secret-access
  namespace: gku
  labels:
    propdev.ru/binding: privileged
  annotations:
    propdev.ru/access-type: just-in-time
    propdev.ru/ticket: SEC-1042
subjects:
  - kind: Group
    name: propdev:operators:gku:lead
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: secret-reader
  apiGroup: rbac.authorization.k8s.io
