# Привилегированный доступ к секретам. Role в каждом namespace, а не ClusterRole,
# чтобы доступ нельзя было расширить на весь кластер.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-reader
  namespace: sales
  labels:
    propdev.ru/role-kind: privileged
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
